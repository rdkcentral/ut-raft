IThermalSensor:                                    # root node (Component object begins)
    command: "temperature_update"                  # command name - injects a temperature reading from a thermal sensor
    sensorName: "SoC Die"                          # name of the sensor providing the reading (e.g. "SoC Die", "DDR", "RF")
    temperatureCelsius: 100.0                      # temperature value to inject in degrees Celsius
    timestampMonotonicMs: 0                        # monotonic timestamp in milliseconds (0 = use current time)
