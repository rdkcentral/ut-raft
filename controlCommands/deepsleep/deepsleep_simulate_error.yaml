deepsleep:                               # root node (Component object begins)
    command: "DEEPSLEEP_SIMULATE_ERROR"  # command name - injects a failure into the deep sleep sequence
    error_type: "BEFORE_DEEPSLEEP"       # When to inject: BEFORE_DEEPSLEEP (sleep never starts) | AFTER_DEEPSLEEP (error occurs after sleep completes)
    return_code: "false"                 # Stub return value reported to app: true = sleep succeeded, false = sleep failed
    exception: "EX_NONE"                 # Exception type to raise: EX_NONE | (future exception types per HAL interface)
