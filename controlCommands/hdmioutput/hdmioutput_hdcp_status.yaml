hdmioutput:                       # root node
  command: hdcp_status            # command name - fires an HDCP authentication-status event for the HDMI output port
  description: Sends the HDCP status change event for HDMI output port.  # human-readable note (not parsed by stub)
  params:                         # parameters for the command
    port: 0                       # HDMI output port index (0-based, platform-dependent)
    status: AUTHENTICATED         # HDCP auth result: AUTHENTICATED | UNAUTHENTICATED | AUTHENTICATION_IN_PROGRESS | AUTHENTICATION_FAILURE
    version: VERSION_2_X         # HDCP version negotiated: UNDEFINED | VERSION_1_X | VERSION_2_X
