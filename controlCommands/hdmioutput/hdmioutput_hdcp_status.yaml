# HDMI Output HDCP Status Event
#
# Fires an HDCP authentication-status event for the HDMI output port.

hdmioutput:
  command: hdcp_status
  # Type: string
  # Supported values: hdcp_status
  # Fires an HDCP authentication-status event for the HDMI output port.

  description: Sends the HDCP status change event for HDMI output port.
  # Type: string
  # Human-readable description of the command (documentation only).

  params:
    # Command parameters

    port: 0
    # Type: integer
    # HDMI output port index (0-based).
    # Range: Platform dependent (example: 0, 1, 2...)

    status: AUTHENTICATED
    # Type: enum string
    # HDCP auth result.
    # Values:
    #   AUTHENTICATED
    #   UNAUTHENTICATED
    #   AUTHENTICATION_IN_PROGRESS
    #   AUTHENTICATION_FAILURE

    version: VERSION_2_X
    # Type: enum string
    # HDCP version negotiated.
    # Values:
    #   UNDEFINED
    #   VERSION_1_X
    #   VERSION_2_X
