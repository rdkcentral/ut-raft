# HDMI Output EDID Read Event
#
# Injects an EDID data read event for the HDMI output port.

hdmioutput:
  command: edid_read
  # Type: string
  # Supported values: edid_read
  # Injects an EDID data read event for the HDMI output port.

  description: Sends the EDID read event for HDMI output port.
  # Type: string
  # Human-readable description of the command (documentation only).

  params:
    # Command parameters

    port: 0
    # Type: integer
    # HDMI output port index (0-based).
    # Range: Platform dependent (example: 0, 1, 2...)

    data: [0x00,0xFF,0xFF,0xFF,0xFF,0xFF,0xFF,0x00,0x10,0xAC,0x32,0x42,0x4C,0x4C,0x4C,0x4C,  # bytes 0-15:  EDID header + manufacturer/product ID
            0x02,0x19,0x01,0x03,0x80,0x3C,0x22,0x78,0xEA,0x1E,0xC5,0xAE,0x50,0x46,0x91,0x26,  # bytes 16-31: EDID version, basic display params, chromaticity
            0x0E,0x50,0x54,0xA5,0x4B,0x00,0x71,0x4F,0x81,0x80,0xA9,0x40,0xB3,0x00,0xD1,0xC0,  # bytes 32-47: established timings, standard timings
            0x01,0x01,0x01,0x01,0x01,0x01,0x04,0x74,0x00,0x30,0xF2,0x70,0x5A,0x80,0xB0,0x58,  # bytes 48-63: detailed timing descriptor 1
            0x8A,0x00,0x50,0x1D,0x74,0x00,0x00,0x1E,0x00,0x00,0x00,0xFF,0x00,0x48,0x44,0x4D,  # bytes 64-79: descriptor continued + serial number descriptor
            0x49,0x32,0x30,0x5F,0x54,0x45,0x53,0x54,0x0A,0x20,0x00,0x00,0x00,0xFC,0x00,0x48,  # bytes 80-95: serial number + monitor name descriptor
            0x44,0x4D,0x49,0x20,0x32,0x2E,0x30,0x20,0x44,0x69,0x73,0x70,0x00,0x00,0x00,0xFD,  # bytes 96-111: monitor name "HDMI 2.0 Disp" + range limits descriptor
            0x00,0x38,0x4B,0x1E,0x87,0x1E,0x00,0x0A,0x20,0x20,0x20,0x20,0x20,0x20,0x01,0x9A,  # bytes 112-127: range limits + extension flag + checksum
            0x02,0x03,0x3E,0x70,0xE3,0x05,0x03,0x01,0x02,0x03,0x04,0x05,0x90,0x23,0x09,0x07,  # CEA extension block header + video data block (SVDs)
            0x07,0x83,0x01,0x00,0x00,0x6D,0x03,0x0C,0x00,0x20,0x00,0xB8,0x3C,0x20,0x00,0x60,  # audio data block + HDMI VSDB (IEEE OUI 0x000C03)
            0x01,0x02,0x03,0x67,0xD8,0x5D,0xC4,0x01,0x3C,0x03,0xE2,0x00,0x0F,0xE3,0x06,0x0D,  # HDMI VSDB continued + HDMI forum VSDB
            0x01,0x01,0x1D,0x00,0x72,0x51,0xD0,0x1E,0x20,0x6E,0x28,0x55,0x00,0x50,0x1D,0x74,  # detailed timing descriptors in extension
            0x00,0x00,0x1E,0x02,0x3A,0x80,0x18,0x71,0x38,0x2D,0x40,0x58,0x2C,0x45,0x00,0x50,  # 1080p60 timing descriptor
            0x1D,0x74,0x00,0x00,0x1E,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,  # 1080i50 timing + padding
            0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,  # padding
            0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0xC1]  # padding + CEA extension checksum=0xC1
    # Type: list[uint8]
    # EDID binary blob (256 bytes); base block (128 bytes) + extension block (128 bytes).
