# HDMI Input Signal Status Event
#
# Fires signal-status callback on the HDMI input port.

hdmiinput:
  command: signal_status
  # Type: string
  # Supported values: signal_status
  # Fires signal-status callback on the HDMI input port.

  description: Sends the signal status of HDMI input ports.
  # Type: string
  # Human-readable description of the command (documentation only).

  params:
    # Command parameters

    port: 0
    # Type: integer
    # HDMI input port index (0-based).
    # Range: Platform dependent (example: 0, 1, 2...)

    state: LOCKED
    # Type: enum string
    # Signal state to inject.
    # Values:
    #   UNKNOWN
    #   NO_SIGNAL
    #   UNSTABLE
    #   NOT_SUPPORTED
    #   LOCKED
