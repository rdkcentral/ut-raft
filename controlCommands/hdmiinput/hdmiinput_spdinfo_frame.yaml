hdmiinput:                        # root node
  command: spdinfo_frame          # command name - injects a Source Product Descriptor (SPD) InfoFrame
  description: Sends the spdinfo frame to HDMI input ports  # human-readable note (not parsed by stub)
  params:                         # parameters for the command
    port: 0                       # HDMI input port index (0-based, platform-dependent)
    data: [0x83, 0x01, 0x19, 0x8E, 0x4F, 0x50, 0x45, 0x4E, 0x41, 0x49, 0x20, 0x20, 0x20, 0x20, 0x20, 0x20, 0x42, 0x4C, 0x55, 0x52, 0x41, 0x59, 0x20, 0x20, 0x20, 0x20, 0x20, 0x01]  # raw SPD InfoFrame bytes per CEA-861: [type=0x83, version, length, checksum, vendor name (8 bytes), product name (16 bytes), source device type]
