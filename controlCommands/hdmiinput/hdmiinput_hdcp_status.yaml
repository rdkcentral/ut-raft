hdmiinput:                        # root node
  command: hdcp_status            # command name - fires HDCP authentication-status callback on the HDMI input port
  description: Sends the HDCP status of HDMI input ports.  # human-readable note (not parsed by stub)
  params:                         # parameters for the command
    port: 0                       # HDMI input port index (0-based, platform-dependent)
    state: AUTHENTICATED          # HDCP state: UNKNOWN | UNAUTHENTICATED | AUTHENTICATION_IN_PROGRESS | AUTHENTICATION_FAILURE | AUTHENTICATED
    version: VERSION_2_X         # HDCP version reported: UNDEFINED | VERSION_1_X | VERSION_2_X
