compositeinput:                   # root node
  command: video_mode             # command name
  description: Reports a detected video mode change on a composite input port (port must be STARTED).  # human-readable note (not parsed by stub)
  params:                         # parameters for the command
    port: 0                       # Port index (0-based)
    pixelWidth: 720               # Horizontal resolution in pixels (e.g. 720 for SD NTSC/PAL)
    pixelHeight: 480              # Vertical resolution in pixels; 480 = NTSC (North America), 576 = PAL (Europe)
    interlaced: true              # Scanning method: true = interlaced (480i/576i), false = progressive (480p/576p)
    frameRateInHz: 29.97          # Frame rate in Hz; 25.0 = PAL, 29.97 = NTSC, 50.0 = PAL-p, 59.94 = NTSC-p
