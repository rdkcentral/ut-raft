compositeinput:                   # root node
  command: signal_status          # command name
  description: Sets the signal status on a composite input port.  # human-readable note (not parsed by stub)
  params:                         # parameters for the command
    port: 0                       # Port index (0-based); valid range: 0 to (total_ports-1), platform-dependent
    signalStatus: STABLE          # Options: NO_SIGNAL | UNSTABLE | NOT_SUPPORTED | STABLE
