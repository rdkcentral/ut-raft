# HDMI CEC Configure Device Map (Single Device)
#
# Initializes the full CEC device map from scratch with a single root device.

HdmiCec:
  command: configure
  # Type: string
  # Supported values: configure
  # Initializes the full CEC device map from scratch.

  description: Initialize HDMI CEC device map
  # Type: string
  # Human-readable description of the command (documentation only).

  config:
    emulated_device:
      # The CEC identity the stub emulates on behalf of the DUT.

      name: "VTV"
      # Type: string
      # Unique name for the emulated device (the DUT).

      language: "eng"
      # Type: string
      # ISO 639-2 three-letter language code.
      # Example: eng, fra, deu

      cec_version: "1.4"
      # Type: string
      # CEC spec version.
      # Values:
      #   "1.3a"
      #   "1.4"
      #   "2.0"

      device_type: "TV"
      # Type: enum string
      # CEC device type.
      # Values:
      #   TV
      #   RecordingDevice
      #   PlaybackDevice
      #   Tuner
      #   AudioSystem
      #   Switch

      power_status: "on"
      # Type: enum string
      # Power state.
      # Values:
      #   on
      #   off
      #   standby
      #   transitionToOn
      #   transitionToStandby

      port_id: 0
      # Type: uint
      # Physical HDMI port (0 = TV root, no parent).

      fault: no
      # Type: enum string
      # Fault state.
      # Values:
      #   no  - normal operation
      #   yes - error state

      number_of_ports: 4
      # Type: uint
      # Total downstream HDMI ports available on this device.

      active_source: false
      # Type: boolean
      # Whether this device is the current active source.
      # Values:
      #   true  - active source
      #   false - not active source

    device_map:
      # Full CEC network topology (list of all devices; root device first).

      - device:
        # Root device entry — root of the CEC tree.

        name: "VTV"
        # Type: string
        # Device name (unique identifier in the map).

        language: "eng"
        # Type: string
        # ISO 639-2 language code.

        cec_version: "1.4"
        # Type: string
        # CEC spec version.

        device_type: "TV"
        # Type: enum string
        # CEC device type.

        power_status: "on"
        # Type: enum string
        # Power state.

        fault: no
        # Type: enum string
        # Fault state.
        # Values:
        #   no  - normal operation
        #   yes - error state

        port_id: 0
        # Type: uint
        # HDMI port on parent device (0-based; 0 = root/TV).

        number_of_ports: 4
        # Type: uint
        # Downstream HDMI ports on this device.

        active_source: false
        # Type: boolean
        # Active source flag.
        # Values:
        #   true  - active source
        #   false - not active source

        children: []
        # Type: list
        # Child devices connected downstream (empty = no other devices on the bus).
