HdmiCec:                          # root node
  command: cec_message            # command name - sends a raw user-defined CEC message
  description: Send a CEC message  # human-readable note (not parsed by stub)
  message:                        # CEC message descriptor block
    user_defined: true            # true = raw payload mode; source/destination/opcode fields are ignored
    payload: ["0x50", "0x82", "0x10", "0x00"]  # raw CEC frame bytes as hex strings: [initiator+destination, opcode, param1, param2, ...]
