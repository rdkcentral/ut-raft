HdmiCec:                               # root node
  command: add_device                  # command name - dynamically adds a new device to the CEC network
  description: Add a new HDMI CEC device to the device map  # human-readable note (not parsed by stub)
  device:                              # descriptor block for the new device to add
    name: "GameConsole"                # unique logical name; used to reference this device in other commands
    parent: "VTV"                      # name of the parent device in the CEC tree (must already exist in device map)
    language: "eng"                    # ISO 639-2 three-letter language code (e.g. eng, fra, deu, spa)
    cec_version: "1.4"                 # CEC specification version supported: "1.3a" | "1.4" | "2.0"
    device_type: "PlaybackDevice"      # CEC device type: TV | RecordingDevice | PlaybackDevice | Tuner | AudioSystem | Switch
    power_status: on                   # Initial power state: on | off | standby | transitionToOn | transitionToStandby
    fault: no                          # Fault/error state: no = normal operation, yes = device in error state
    port_id: 1                         # Physical HDMI port on parent device (0-based; 0 = directly on TV root)
    number_of_ports: 0                 # Downstream HDMI ports this device provides (0 = leaf/sink, >0 = hub/repeater)
    active_source: false               # Whether this device is the current active CEC source: true | false
