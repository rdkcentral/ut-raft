HdmiCec:                          # root node
  command: cec_message            # command name - sends a named CEC message between two devices
  description: Send a CEC message  # human-readable note (not parsed by stub)
  message:                        # CEC message descriptor block
    user_defined: false           # false = use named source/destination/opcode; true = use raw payload bytes only
    source: "YAMAHA"              # logical name of the sending device (must exist in the device map)
    destination: "VTV"            # logical name of the receiving device (must exist in the device map)
    opcode: "CecVersion"          # CEC opcode name (e.g. CecVersion | ActiveSource | Standby | RequestActiveSource)
    type: "Direct"                # Message routing: Direct = unicast to destination | Broadcast = sent to all devices
    payload: ["cec_version"]      # Optional opcode parameters; contents are opcode-dependent (omit if none needed)
