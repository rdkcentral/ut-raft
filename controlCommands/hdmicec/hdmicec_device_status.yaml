HdmiCec:                          # root node
  command: update_device_status   # command name - updates power/fault state of an existing CEC device
  description: Updates the status of an HDMI CEC device  # human-readable note (not parsed by stub)
  device:                         # device selector and new state values
    name: "GameConsole"           # name of the target device; must exist in the device map
    power_status: "off"           # New power state: on | off | standby | transitionToOn | transitionToStandby
    fault: "yes"                  # Fault state: no = normal operation, yes = device is in an error state
