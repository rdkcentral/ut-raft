HdmiCec:                               # root node
  command: configure                   # command name - initializes the full CEC network with multiple devices
  description: Initialize HDMI CEC device map  # human-readable note (not parsed by stub)
  config:                              # top-level configuration block
    emulated_device:                   # the CEC identity the stub emulates on behalf of the DUT
      name: "VTV"                      # unique name for the emulated device (the DUT)
      language: "eng"                  # ISO 639-2 three-letter language code (e.g. eng, fra, deu)
      cec_version: "1.4"               # CEC spec version: "1.3a" | "1.4" | "2.0"
      device_type: "TV"                # CEC device type: TV | RecordingDevice | PlaybackDevice | Tuner | AudioSystem | Switch
      power_status: "on"               # Power state: on | off | standby | transitionToOn | transitionToStandby
      port_id: 0                       # Physical HDMI port (0 = TV root, no parent)
      fault: no                        # Fault state: no = normal operation, yes = error state
      number_of_ports: 4               # Total downstream HDMI ports available on this device
      active_source: false             # Whether this device is the current active source: true | false
    device_map:                        # full CEC network topology tree (all devices; root device listed first)
      - device:                        # root device entry (the TV / DUT)
        name: "VTV"                    # device name (unique identifier in the map)
        language: "eng"                # ISO 639-2 language code
        cec_version: "1.4"             # CEC spec version
        device_type: "TV"              # CEC device type
        power_status: "on"             # Power state
        fault: no                      # Fault state: no | yes
        port_id: 0                     # HDMI port on parent (0 = root / TV)
        number_of_ports: 4             # Downstream HDMI ports on this device
        active_source: false           # Active source flag: true | false
        children:                      # devices physically connected to VTV's HDMI ports
          - device:                    # child 1: AV receiver connected to VTV port 3
            name: "YAMAHA"             # device name
            language: "eng"            # ISO 639-2 language code
            cec_version: "1.4"         # CEC spec version
            device_type: "AudioSystem" # CEC device type: AudioSystem = AV receiver / soundbar
            power_status: "on"         # Power state
            fault: no                  # Fault state: no | yes
            port_id: 3                 # Port on parent device (VTV port 3)
            number_of_ports: 2         # YAMAHA has 2 downstream HDMI ports
            active_source: true        # YAMAHA is currently the active CEC source
            children:                  # devices connected downstream of YAMAHA
              - device:                # grandchild 1: Blu-ray player connected to YAMAHA port 1
                name: "PIONEER"        # device name
                language: "eng"        # ISO 639-2 language code
                cec_version: "1.4"     # CEC spec version
                device_type: "PlaybackDevice"  # CEC device type
                power_status: "on"     # Power state
                fault: no              # Fault state: no | yes
                port_id: 1             # Port on parent device (YAMAHA port 1)
                number_of_ports: 0     # No downstream ports (leaf / sink device)
                active_source: false   # Not the active source
                children: []           # No children (leaf device)
              - device:                # grandchild 2: streaming dongle connected to YAMAHA port 2
                name: "GOOGLE"         # device name
                language: "eng"        # ISO 639-2 language code
                cec_version: "1.4"     # CEC spec version
                device_type: "PlaybackDevice"  # CEC device type
                power_status: "standby"  # Power state: in standby
                fault: no              # Fault state: no | yes
                port_id: 2             # Port on parent device (YAMAHA port 2)
                number_of_ports: 0     # No downstream ports (leaf / sink device)
                active_source: false   # Not the active source
                children: []           # No children (leaf device)
          - device:                    # child 2: set-top box connected to VTV port 2
            name: "IPSTB"              # device name
            language: "eng"            # ISO 639-2 language code
            cec_version: "1.4"         # CEC spec version
            device_type: "PlaybackDevice"  # CEC device type
            power_status: "standby"    # Power state: in standby
            fault: no                  # Fault state: no | yes
            port_id: 2                 # Port on parent device (VTV port 2)
            number_of_ports: 0         # No downstream ports (leaf / sink device)
            active_source: false       # Not the active source
            children: []               # No children (leaf device)
          - device:                    # child 3: CEC adapter/switch connected to VTV port 0
            name: "CECAdapter"         # device name
            language: "eng"            # ISO 639-2 language code
            cec_version: "1.4"         # CEC spec version
            device_type: "RecordingDevice"  # CEC device type
            power_status: "on"         # Power state
            fault: no                  # Fault state: no | yes
            port_id: 0                 # Port on parent device (VTV port 0)
            number_of_ports: 2         # CECAdapter has 2 downstream HDMI ports
            active_source: false       # Not the active source
            children:                  # devices connected downstream of CECAdapter
              - device:                # grandchild: game console connected to CECAdapter port 1
                name: "GameConsole"    # device name
                language: "eng"        # ISO 639-2 language code
                cec_version: "1.4"     # CEC spec version
                device_type: "PlaybackDevice"  # CEC device type
                power_status: "on"     # Power state
                fault: no              # Fault state: no | yes
                port_id: 1             # Port on parent device (CECAdapter port 1)
                number_of_ports: 0     # No downstream ports (leaf / sink device)
                active_source: false   # Not the active source
                children: []           # No children (leaf device)
